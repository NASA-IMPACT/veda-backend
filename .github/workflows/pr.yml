name: Pull Request - Lint and Test Workflow

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - name: Install python dependencies
        run: |
          make install-dev

      - name: Run linting
        run: |
          make lint

  lint-conventional-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    needs: [lint, lint-conventional-pr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Launch services
        run: |
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{secrets.AWS_SECRET_ACCESS_KEY}}
          docker compose up --build -d

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - name: Install python dependencies
        run: |
          make install-dev

      - name: Wait for pgstac seed data load
        run: |
          load_exit_code="$(docker wait veda.loadtestdata)"
          if [ "$load_exit_code" -ne 0 ]; then
            echo "pypgstac seed load failed with exit code $load_exit_code"
            docker logs veda.loadtestdata
            exit 1
          fi

      - name: Wait for STAC API to be ready
        run: |
          echo "Waiting for STAC API to be available at localhost:8081..."
          timeout 120 bash -c 'until curl -f http://localhost:8081/api/stac/_mgmt/ping 2>/dev/null; do sleep 0.25; done'
          echo "STAC API is ready!"

      - name: Integrations tests
        run: uv run pytest .github/workflows/tests/ -vv -s

      - name: Install reqs for ingest api
        run: |
          uv sync --project ingest_api/runtime --group test

      - name: Install reqs for stac api
        run: uv sync --project stac_api/runtime --group test

      - name: Ingest unit tests
        env:
          PGSTAC_VERSION: 0.9.6
        run: |
          NO_PYDANTIC_SSM_SETTINGS=1 uv run --project ingest_api/runtime --with common/auth --with "pypgstac==${PGSTAC_VERSION}" pytest ingest_api/runtime/tests/ -vv -s

      - name: Stac-api extensions unit tests
        run: uv run --project stac_api/runtime --with common/auth pytest stac_api/runtime/tests/ --asyncio-mode=auto -vv -s

      - name: Auth unit tests
        run: uv run --with common/auth pytest common/auth/tests/ -vv -s

      - name: Stop services
        run: docker compose stop

  predeploy:
    needs: [test]

    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - name: Configure awscli
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Install python dependencies
        run: |
          make install-dev

      - name: Get environment configuration for target branch
        run: |
          if [ "${{ github.base_ref }}" == "develop" ]; then
            ./scripts/get-env.sh "veda-backend-uah-dev-env"
          else
            echo "No environment associated with ${GITHUB_REF##*/} branch. Test changes against dev stack"
            ./scripts/get-env.sh "veda-backend-uah-dev-env"
          fi

      - name: Pre deployment CDK diff
        run: |
          echo $STAGE
          make diff
