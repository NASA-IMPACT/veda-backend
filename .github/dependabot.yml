version: 2
updates:

  - package-ecosystem: uv
    directory: /
    cooldown:
      default-days: 7
      semver-major-days: 30
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
        - "*"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
        - "*"
    commit-message:
      prefix: "ci(deps):"

  # Re-enable once pydocstyle is re-enabled in pre-commit-config.yaml
