name: Resolve configuration variables

description: Resolve VEDA stack names and STAC Browser tag

inputs:
  dir:
    required: false
    type: string
    default: "."

runs:
  using: composite
  steps:
    - name: Resolve configuration variables
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        uv run python - <<'PY' >> "$GITHUB_ENV"
        import os
        from config import veda_app_settings

        sb_version_tag = (
            os.getenv("STAC_BROWSER_TAG")
            or veda_app_settings.stac_browser_tag
        )

        print(f"VEDA_BACKEND_STACK_NAME={veda_app_settings.veda_backend_stack_name}")
        print(f"SB_STACK_NAME={veda_app_settings.stac_browser_stack_name}")
        print(f"SB_VERSION_TAG={sb_version_tag}")
        PY

        if [ -z "${SB_VERSION_TAG:-}" ]; then
          echo "Error: STAC Browser tag is empty. Set STAC_BROWSER_TAG or configure stac_browser_tag in config."
          exit 1
        fi
