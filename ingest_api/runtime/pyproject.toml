[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veda.ingest_api"
version = "0.0.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.5",
    "ddbcereal==2.1.1",
    "fastapi>=0.109.1",
    "fsspec==2023.3.0",
    "mangum>=0.15.0",
    "orjson>=3.6.8",
    "psycopg[binary,pool]>=3.0.15",
    "pydantic>=2.4.1",
    "python-multipart>=0.0.27,<0.1",
    "requests>=2.27.1",
    "s3fs==2023.3.0",
    "stac-pydantic==3.1.3",
    "boto3==1.24.59",
    "aws_xray_sdk>=2.6.0,<3",
    "aws-lambda-powertools>=1.18.0",
    "pydantic-settings>=2.4.1",
    "eoapi-auth-utils==0.3.0",
]

[dependency-groups]
test = [
    "moto[dynamodb,ssm]>=4.0.9,<5.0",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["tests*"]
