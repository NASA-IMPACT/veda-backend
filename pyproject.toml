[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veda-backend"
authors = [
    { name = "Development Seed", email = "info@developmentseed.org" }
]
urls = { "Homepage" = "https://github.com/NASA-IMPACT/veda-backend" }
version = "0.0.0"
description = "VEDA backend dependency bundle"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "aws-cdk-lib<3.0.0,>=2.47.0.a0",
    "constructs>=10.0.0,<11.0.0",
    "aws-cdk.aws_apigatewayv2_alpha~=2.47.0.a0",
    "aws_cdk.aws_apigatewayv2_integrations_alpha~=2.47.0.a0",
    "pydantic>=2.13.4",
    "eoapi-cdk==11.6.4",
    "pydantic-settings>=2.4.1"
]

[dependency-groups]
dev = [
	"pre-commit>=4.6.2",
    "python-dotenv",
]

test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx==0.28.1",
    "pypgstac==0.8.5",
    "psycopg[binary, pool]",
    "fastapi",
    "openapi-schema-validator"
]

[tool.semantic_release]
version_source = "tag_only"
assets = []
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "angular"
logging_use_named_masks = false
major_on_zero = true
tag_format = "v{version}"

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
exclude_commit_patterns = ["(?!build|chore|ci|docs|feat|fix|perf|style|refactor|test).*$"]

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
plugins = ["pydantic.mypy"]
exclude = ".*/build/.*"
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
exclude = ["ez_setup", "examples", "tests"]

[tool.setuptools.package-data]
"veda-backend" = ["templates/*.html", "templates/*.xml"]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "FAST", # fastapi
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "TID",  # flake8-tidy-imports
    "TC",   # flake8-type-checking
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
]
ignore = [
  "BLE001",  # Blind Exceptions
  "B008",    # Function calls in argument defaults (Fastapi: Depends)
  "FAST003", # Parameter appears in route path, but not in function signature (Parameter used in Depends)
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.markdownlint-cli2.config]
MD013 = false
MD033 = { allowed_elements = ["a", "b", "details", "summary"] }

[tool.ruff.lint.isort]
combine-as-imports = true
