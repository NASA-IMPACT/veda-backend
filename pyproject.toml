[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veda-backend"
authors = [
    { name = "Development Seed", email = "info@developmentseed.org" }
]
urls = { "Homepage" = "https://github.com/NASA-IMPACT/veda-backend" }
version = "0.0.0"
description = "VEDA backend dependency bundle"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "aws-cdk-lib<3.0.0,>=2.47.0.a0",
    "constructs>=10.0.0,<11.0.0",
    "aws-cdk.aws_apigatewayv2_alpha~=2.47.0.a0",
    "aws_cdk.aws_apigatewayv2_integrations_alpha~=2.47.0.a0",
    "pydantic>=2.4.1",
    "eoapi-cdk==5.4.0",
    "pydantic-settings>=2.4.1"
]

[dependency-groups]
dev = [
    "mypy>=1.11.1",
	"pre-commit>=3.8.0",
	"ruff>=0.5.6",
    "python-dotenv",
]

test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx==0.23.3",
    "pypgstac==0.8.5",
    "psycopg[binary, pool]",
    "fastapi",
    "openapi-schema-validator"
]

[tool.uv]
package = false

[tool.semantic_release]
version_source = "tag_only"
assets = []
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "angular"
logging_use_named_masks = false
major_on_zero = true
tag_format = "v{version}"

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
exclude_commit_patterns = ["(?!build|chore|ci|docs|feat|fix|perf|style|refactor|test).*$"]

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pydocstyle]
select = "D1"
match = '(?!test|ingest_api).*\.py'

[tool.mypy]
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
exclude = ["ez_setup", "examples", "tests"]

[tool.setuptools.package-data]
"veda-backend" = ["templates/*.html", "templates/*.xml"]
