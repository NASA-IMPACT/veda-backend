[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veda.stac_api"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "boto3",
    "async-lru>=2.0.5",
    "starlette==1.0.1",
    "stac-fastapi.api>=6.1,<6.3",
    "stac-fastapi.types>=6.1,<6.3",
    "stac-fastapi.extensions>=6.1,<6.3",
    "stac-fastapi.pgstac>=6.1,<6.3",
    "jinja2>=2.11.2,<4.0.0",
    "starlette-cramjam>=0.4.0",
    "importlib_resources>=1.1.0;python_version<='3.11'",  # https://github.com/cogeotiff/rio-tiler/pull/379
    "pygeoif<=0.8",  # newest release (1.0+ / 09-22-2022) breaks a number of other geo libs
    "aws-lambda-powertools>=1.18.0",
    "aws_xray_sdk>=2.6.0,<3",
    "pystac[validation]>=1.14.0",
    "pydantic>2",
    "stac-auth-proxy==1.1.1",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "requests",
]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "src.version.__version__" }

[tool.setuptools.package-data]
src = ["templates/*.html"]
