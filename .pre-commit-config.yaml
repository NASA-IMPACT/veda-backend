repos:
  - repo: local
    hooks:
      - id: lint
        name: Lint Code
        entry: make lint
        language: system
        types: [python]
        stages: [pre-commit]

      - id: format
        name: Format Code
        entry: make format
        language: system
        types: [python]
        stages: [pre-commit]

      - id: uv-lock
        name: Check uv.lock is up to date
        entry: uv lock --check
        language: system
        files: pyproject\.toml
        pass_filenames: false
        stages: [pre-commit]

  # re-enable pydocstyle once we have docstrings in place
