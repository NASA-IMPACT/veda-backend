repos:
  - repo: local
    hooks:
      - id: lint
        name: Lint Code
        entry: make lint
        language: system
        types: [python]
        stages: [commit]

      - id: format
        name: Format Code
        entry: make format
        language: system
        types: [python]
        stages: [commit]

  - repo: https://github.com/PyCQA/pydocstyle
    rev: 5.1.1
    hooks:
      - id: pydocstyle
        language_version: python

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.2.0
    hooks:
      - id: mypy
        language_version: python
        additional_dependencies: ['types-requests', 'types-cachetools', 'types-PyYAML']
