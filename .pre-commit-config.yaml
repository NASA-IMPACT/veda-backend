repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi, pyproject]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args:
        - "--fix"
        - "--config"
        - "pyproject.toml"
        - "--configPointer"
        - "/tool/markdownlint-cli2"

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5
    hooks:
      - id: uv-lock
      - id: uv-lock
        name: uv-lock (common/auth)
        args: [--project, common/auth]
        files: ^common/auth/(uv\.lock|pyproject\.toml)$
      - id: uv-lock
        name: uv-lock (ingest_api/runtime)
        args: [--project, ingest_api/runtime]
        files: ^ingest_api/runtime/(uv\.lock|pyproject\.toml)$
      - id: uv-lock
        name: uv-lock (raster_api/runtime)
        args: [--project, raster_api/runtime]
        files: ^raster_api/runtime/(uv\.lock|pyproject\.toml)$
      - id: uv-lock
        name: uv-lock (stac_api/runtime)
        args: [--project, stac_api/runtime]
        files: ^stac_api/runtime/(uv\.lock|pyproject\.toml)$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.13.4
          - pydantic-settings>=2.4.1
